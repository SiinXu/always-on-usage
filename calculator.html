<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><script>try{const t=localStorage.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script><title>额度风险计算器 | 常驻用量</title><meta name="description" content="输入 Bot 数、浏览器、routine 频率估算额度风险"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233D8BFF'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript><link rel="stylesheet" href="/src/style.css"></head><body class=""><a class="skip" href="#main">跳到正文</a><header class="top"><a class="brand" href="index.html" aria-label="常驻用量 首页"><span class="mark" aria-hidden="true"></span>常驻用量</a><nav aria-label="主导航"><a href="compare.html">对照</a><a href="cases/">案例</a><a href="calculator.html" aria-current="page">计算器</a><a href="about.html">关于</a></nav><button class="tt" type="button" aria-label="切换明暗主题"><span aria-hidden="true"></span></button></header><main id="main">
<section class="calc-page"><div class="calc-copy"><h1>额度会不会<br>烧穿</h1><p class="lede">转旋钮定 Bot 数，扳拨杆开浏览器，选频率。纯前端计算，不上传任何数据。</p><ul class="rules"><li><b>Bot 数</b>3 到 5 个加 1 分，6 个以上加 2 分</li><li><b>浏览器</b>开启加 1 分</li><li><b>频率</b>每日加 1 分，每小时加 2 分</li><li><b>结果</b>0 到 1 分低，2 到 3 分中，4 分以上高</li></ul></div><form id="calc" class="dial dial-big" aria-label="额度风险计算器"><span class="beam" aria-hidden="true"></span><div class="dial-controls"><div class="knob-wrap"><span class="ctl-label" id="lb-bots">Bot 数量</span><div class="knob mag" role="slider" tabindex="0" aria-labelledby="lb-bots" aria-valuemin="1" aria-valuemax="20" aria-valuenow="3" aria-valuetext="3 个 Bot"><span class="knob-face"><span class="knob-tick"></span></span><output class="knob-num" data-bots>3</output></div><div class="knob-step"><button type="button" data-step="-1" aria-label="减少一个 Bot">-</button><button type="button" data-step="1" aria-label="增加一个 Bot">+</button></div><input type="hidden" name="bots" value="3"></div><div class="dial-right"><label class="lever"><input type="checkbox" name="browser" role="switch"><span class="lever-track" aria-hidden="true"><span class="lever-handle"></span></span><span class="ctl-label">浏览器步骤</span></label><fieldset class="pills"><legend class="ctl-label">Routine 频率</legend><label><input type="radio" name="routine" value="rare"><span>按需</span></label><label><input type="radio" name="routine" value="daily" checked><span>每日</span></label><label><input type="radio" name="routine" value="hourly"><span>每小时</span></label></fieldset></div></div><output id="out" class="dial-out" aria-live="polite"></output></form></section></main><footer class="foot"><p>所有数字都是<b>估算方向</b>，不是厂商官方计费口径。</p><p class="links"><a href="/data/agents.json">agents.json</a><a href="/data/cases.json">cases.json</a><a href="/llms.txt">llms.txt</a></p></footer><script type="module" src="/src/main.js"></script></body></html>
